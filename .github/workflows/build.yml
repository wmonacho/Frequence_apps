name: Construire les APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler
        run: gradle assembleRelease --no-daemon

      - name: Rassembler les APK
        run: |
          mkdir -p out
          for f in $(find app/build/outputs/apk -name "*-release.apk"); do
            flavor=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            case "$flavor" in
              rouille|bitabit|dodiese|miseenprod) cp "$f" "out/Coda-${flavor}.apk" ;;
              *) cp "$f" "out/Frequence-${flavor}.apk" ;;
            esac
          done
          ls -l out

      - name: Publier dans « Releases »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk out/*.apk --title "APK à installer" --notes "Dernière version, compilée depuis ${GITHUB_SHA::7}." --target "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
